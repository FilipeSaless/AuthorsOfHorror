<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Livros - Authors of Horror</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script src="./assets/app.js" defer></script>
    <script src="https://kit.fontawesome.com/61912f5026.js" crossorigin="anonymous"></script>
</head>
<body>

    <aside class="sidebar">
        <button class="sidebar-toggle" aria-label="Abrir menu" type="button">
            <i class="fa-solid fa-bars"></i>
        </button>
        <nav class="icons_profile">
            <a href="./perfil.html" class="side-link">
                <i class="fa-solid fa-circle-user"></i>
                <span>Perfil</span>
            </a>
            <a href="./livros.html" class="side-link">
                <i class="fa-solid fa-book"></i>
                <span>Livros</span>
            </a>
            <a href="./filmes.html" class="side-link">
                <i class="fa-solid fa-film"></i>
                <span>Filmes</span>
            </a>
            <a href="./favoritos.html" class="side-link side-link-fav">
                <i class="fa-solid fa-star"></i>
                <span>Favoritos</span>
            </a>
            <a href="./cadastro.html" class="side-link side-link-admin">
                <i class="fa-solid fa-plus"></i>
                <span>Cadastro</span>
            </a>
        </nav>
    </aside>

    <header class="header">
        <h1><a href="./index.html" class="logo-link">Authors of Horror</a></h1>
        <div class="header-actions">
            <button class="login">Login</button>
            <button class="subscribe">Subscribe</button>
        </div>
    </header>

    <main>

        <div class="search-box">
            <input type="text" placeholder="Buscar">
        </div>

        <section class="books-section">
            <a href="./index.html" class="back-link">&larr; Voltar</a>
            <h2>Catálogo de Livros</h2>
            <div class="books-grid" id="catalogGrid" data-kind="book"></div>
            <p class="empty-state" id="catalogEmpty" style="display:none">Nenhum livro adicionado ao catálogo ainda.</p>
            <p class="empty-state" id="catalogNoResult" style="display:none">Nenhum livro encontrado para sua busca.</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Authors of Horror</p>
        <div class="footer-student">
            <p><strong>Aluno:</strong> Filipe Caldeira Sales Souza</p>
            <p><strong>Curso:</strong> Sistemas de Informação</p>
            <p><strong>Turno:</strong> Noite</p>
            <p><strong>Matrícula:</strong> 913438</p>
        </div>
    </footer>

</body>
</html>
